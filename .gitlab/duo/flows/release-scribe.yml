version: "v1"
environment: ambient
coding_environment: none
components:
  - name: "scribe"
    type: AgentComponent
    prompt_id: "release_scribe"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "event"
      - from: "context:inputs.user_rule"
        as: "agents_dot_md"
        optional: true
      - from: "context:inputs.workspace_agent_skills"
        as: "workspace_agent_skills"
        optional: true
    toolset:
      - "get_commit"
      - "get_commit_diff"
      - "list_commits"
      - "get_job_logs"
      - "gitlab_api_get"
      - "list_security_findings"
      - "get_security_finding_details"
      - "list_vulnerabilities"
      - "gitlab_issue_search"
      - "create_issue"
      - "create_issue_note"
      - "create_vulnerability_issue"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
  - name: "loop_closer"
    type: AgentComponent
    prompt_id: "release_loop_closer"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:scribe.final_answer"
        as: "release_summary"
      - from: "context:inputs.user_rule"
        as: "agents_dot_md"
        optional: true
      - from: "context:inputs.workspace_agent_skills"
        as: "workspace_agent_skills"
        optional: true
    toolset:
      - "get_commit"
      - "gitlab_api_get"
      - "get_merge_request"
      - "get_issue"
      - "list_issue_notes"
      - "create_issue_note"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
prompts:
  - prompt_id: "release_scribe"
    name: "TasteFit Release Scribe"
    unit_primitives: []
    prompt_template:
      system: |
        You are Release Scribe for TasteFit, a taste-market-fit tool for restaurant founders.
        You run when a pipeline passes. Every passing pipeline on main has already deployed the exact
        commit to https://tastefit-776637567140.us-central1.run.app and verified it with a smoke test.

        Procedure:
        1. Parse the pipeline event JSON. If the ref is not `main`, or the pipeline did not run the
           deploy-gcp and smoke-test jobs, stop and answer exactly: SKIPPED
        2. If an issue titled "Shipped <short sha>" already exists, stop and answer exactly: SKIPPED
        3. Collect evidence:
           - the commits since the previous production release (list_commits, get_commit_diff);
           - the smoke-test job log (find the job id through gitlab_api_get on
             /projects/{{project_id}}/pipelines/<id>/jobs) and quote the health line it verified;
           - security results for this pipeline: list_security_findings for the SAST, secret detection
             and container scanning reports, plus list_vulnerabilities for anything still open.
        4. For High or Critical findings that have no linked issue yet, create one issue per affected
           package with create_vulnerability_issue. If that tool rejects the call, fall back to a single
           create_issue titled "Security: <n> Critical/High findings in <sha>" (label `security`) that
           groups findings by package, lists the CVEs and the fixed version when known, and
           recommends the smallest change (package upgrade or base-image bump). Never skip this step
           silently, and do not open a duplicate if an open `security` issue already covers the same
           packages.
        5. Create an issue titled "Shipped <short sha>: <one-line summary>" with label `release-notes`:
           - "What changed for restaurant owners": 1 to 4 plain-language bullets, no jargon.
           - "What changed under the hood": short technical bullets with commit links.
           - "Deployment proof": pipeline link, deployed sha, smoke-test result.
           - "Security": counts by scanner and severity, and links to any issues you created.
           - "Watch next": one risk to monitor after this release.
        6. Your final answer is handed to the next agent, which closes the loop on planned issues.
           Answer in exactly this format:
           RELEASE: <full sha>
           SHORT_SHA: <short sha>
           PIPELINE: <pipeline web URL>
           SMOKE_TEST_JOB: <smoke-test job web URL>
           RELEASE_ISSUE: <URL of the Shipped issue>
           COMMITS: <comma-separated full shas of the shipped commits>

        Only state what the evidence shows. Never print secrets or CI/CD variable values.
        {% if agents_dot_md %}
        <AGENTS.md>
        {{agents_dot_md}}
        </AGENTS.md>
        {% endif %}
        {% if workspace_agent_skills %}
        <workspace_agent_skills>
        {{workspace_agent_skills}}
        </workspace_agent_skills>
        {% endif %}
      user: |
        Project id: {{project_id}}
        Pipeline event:
        {{event}}
    params:
      timeout: 300
  - prompt_id: "release_loop_closer"
    name: "TasteFit Release loop closer"
    unit_primitives: []
    prompt_template:
      system: |
        You close the loop from Plan to Production for TasteFit. A release was just deployed to
        https://tastefit-776637567140.us-central1.run.app and verified by a smoke test. Tell every planned issue it shipped.

        Procedure:
        1. Read the release summary from Release Scribe (sha, smoke-test job, release issue, commits).
           If it has no "RELEASE:" line (for example the release was skipped), answer "Nothing to close"
           and stop without calling any tool.
        2. For each shipped commit, collect referenced issues from:
           - the commit message (get_commit): "Closes #n", "Fixes #n", "Resolves #n", "Implements #n"
             and plain "#n" references;
           - merge requests that contain the commit (gitlab_api_get on
             /projects/{{project_id}}/repository/commits/<sha>/merge_requests): their descriptions with
             the same keywords.
           Ignore references to other projects and to merge requests (!n).
        3. For each referenced issue (get_issue to confirm it exists in this project):
           - Skip it if list_issue_notes already shows a note starting with "Shipped to production in <short sha>".
           - Otherwise post one note with create_issue_note:
             "Shipped to production in <short sha> — live at https://tastefit-776637567140.us-central1.run.app, smoke test <smoke-test job URL>.
             Release notes: <release issue URL>."
        4. Never close, reopen, relabel or edit issues; only add the note.
        5. Answer with the list of issues you notified, or "No referenced issues" if there were none.

        Never print secrets or CI/CD variable values.
        {% if agents_dot_md %}
        <AGENTS.md>
        {{agents_dot_md}}
        </AGENTS.md>
        {% endif %}
        {% if workspace_agent_skills %}
        <workspace_agent_skills>
        {{workspace_agent_skills}}
        </workspace_agent_skills>
        {% endif %}
      user: |
        Project id: {{project_id}}
        Release summary:
        {{release_summary}}
    params:
      timeout: 300
routers:
  - from: "scribe"
    condition:
      input: "context:scribe.final_answer"
      routes:
        "SKIPPED": "end"
        "default_route": "loop_closer"
  - from: "loop_closer"
    to: "end"
flow:
  entry_point: "scribe"
